name: Dev-to-Main Promotion Gatekeeper

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  main-release-gate:
    name: Production Release Gatekeeper Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Source Branch
        run: |
          echo "Pull Request target branch: ${{ github.base_ref }}"
          echo "Pull Request source branch: ${{ github.head_ref }}"

      - name: Run Full Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Core Imports
        run: |
          python -c "
          import importlib
          for mod in ['config.settings', 'core.database', 'core.validators', 'models.student', 'services.report_service']:
              importlib.import_module(mod)
          print('All gatekeeper imports verified successfully!')
          "
